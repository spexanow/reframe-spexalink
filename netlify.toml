[build]
  publish = "."

# Keep the site out of search results until launch (remove this block at launch)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The CEO page is the front door for now
[[redirects]]
  from = "/"
  to = "/ceo/"
  status = 302
